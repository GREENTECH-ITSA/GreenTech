# Gradle
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.caching=true
org.gradle.configuration-cache=true

# Kotlin
kotlin.code.style=official
kotlin.daemon.jvmargs=-Xmx3072m

# Android
android.useAndroidX=true
android.nonTransitiveRClass=true
# AGP 9: composeApp combina Kotlin Multiplatform con com.android.application
# (estructura clásica de KMP con MainActivity en androidMain). Estas dos banderas
# mantienen esa combinación soportada hasta migrar a un módulo androidApp separado.
android.builtInKotlin=false
android.newDsl=false
